[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-aware-clinical-ai"
version = "0.1.0"
description = "Retrospective evidence-aware clinical AI research experiments"
requires-python = ">=3.11,<3.15"
dependencies = [
  "joblib==1.6.0",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "pyarrow==26.0.0",
  "scikit-learn==1.9.1",
  "torch==2.15.0",
  "xgboost==3.4.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
